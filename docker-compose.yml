services:
  postgres:
    image: postgres:16-alpine
    container_name: roadstock-db
    environment:
      POSTGRES_DB: roadstock_db
      POSTGRES_USER: roadstock_user
      POSTGRES_PASSWORD: roadstock_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
