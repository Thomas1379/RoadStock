spring.application.name=roadstock-api

# Connexion PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/roadstock_db
spring.datasource.username=roadstock_user
spring.datasource.password=roadstock_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Port de l'API
server.port=8080
